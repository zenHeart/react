<html>

<body>
    <style>
        .App {
            font-family: sans-serif;
            text-align: center;
        }

        .text {
            height: 20px;
        }

        .cells {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            margin-top: 50px;
        }

        .cell {
            width: 10px;
            height: 10px;
        }

        .cell.green {
            background-color: green;
        }

        .cell.gray {
            background-color: #ccc;
        }
    </style>
    <div id="container"></div>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" data-type="module">
        import React from "https://esm.sh/react@19.0.0?dev";
        import ReactDOMClient from "https://esm.sh/react-dom@19.0.0/client?dev";
        function App() {
            return (
                <div>
                    <h1>Hello React</h1>
                </div>
            );
        }

        const DebugApp = (<React.Profiler id="App" onRender={(id, phase, actualDuration) => {
            debugger
            console.log(`Render ${id} took ${actualDuration}ms`);
        }}>
            <App />
        </React.Profiler>)


        const rootElement = document.getElementById("container");
        const root = ReactDOMClient.createRoot(rootElement)
        debugger
        root.render(DebugApp);
    </script>
</body>

</html>
